name: Upstream sync, build and release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      build_current:
        description: Build/test/sign current version without publishing
        type: boolean
        default: false
      allow_prerelease:
        description: Allow syncing an upstream prerelease (beta) tag
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-release]
permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      smoke: ${{ steps.mode.outputs.smoke }}
      baseline: ${{ steps.mode.outputs.baseline }}
      retry: ${{ steps.detect.outputs.retry }}
      run_id: ${{ steps.detect.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: mode
        env:
          SMOKE: ${{ inputs.build_current || false }}
        run: |
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
          SMOKE: ${{ inputs.build_current || false }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease || false }}
        run: |
          python scripts/autoupdate/control.py detect
          if [ "$SMOKE" = true ]; then
            python scripts/autoupdate/smoke_plan.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sync-plan
          path: automation-out/plan.json
          if-no-files-found: warn
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install pyelftools==0.32
      - run: python -m unittest discover -s test -p 'test_autoupdate*.py' -v
      - run: |
          set -o pipefail
          mkdir -p automation-out
          sh test/run.sh --full 2>&1 | tee automation-out/full-regression.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: baseline-regression
          path: automation-out/full-regression.txt
  fetch:
    needs: [detect, selftest]
    if: needs.detect.outputs.changed == 'true' && needs.detect.outputs.retry != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sync-plan
          path: automation-out
      - name: Fetch pinned data only
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          python scripts/autoupdate/control.py download
          python scripts/autoupdate/fetch_source.py --plan automation-out/plan.json --output automation-out/source
          tar -czf automation-out/source.tar.gz -C automation-out/source .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-inputs
          path: |
            automation-out/server.tar.gz
            automation-out/source.tar.gz
  build:
    needs: [detect, fetch]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sync-plan
          path: automation-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pinned-inputs
          path: automation-out
      - name: Install fixed build dependencies
        run: |
          python -m pip install pyelftools==0.32
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned candidates without credentials
        env:
          SMOKE: ${{ needs.detect.outputs.smoke }}
          # Upstream lockfiles resolve to registry.npmmirror.com, which answers
          # 504 for GitHub-hosted runners often enough to break the sync. Point
          # npm at the canonical registry and rewrite the pinned hosts.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always
        run: |
          mkdir -p automation-out/source
          tar -xzf automation-out/source.tar.gz -C automation-out/source
          python scripts/autoupdate/build.py --plan automation-out/plan.json --source automation-out/source --archive automation-out/server.tar.gz --output automation-out --smoke "$SMOKE"
      - name: Acceptance regression on updated tree
        run: |
          set -o pipefail
          sh test/run.sh --full 2>&1 | tee automation-out/full-regression.txt
      - name: Export allowlisted source candidate
        run: python scripts/autoupdate/bundle.py export automation-out/candidate.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unsigned-candidates
          path: |
            automation-out/*.json
            automation-out/*.zip
            automation-out/*.txt
            automation-out/*.apk
          if-no-files-found: error
  sign:
    needs: [detect, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-candidates
          path: automation-out
      - name: Install signing build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign existing APK only, pinned original certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/autoupdate/sign.py --input automation-out/mobile-unsigned.apk --plan automation-out/plan.json --output signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-apk
          path: signed/*
  publish:
    needs: [detect, build, sign]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.changed == 'true' && needs.detect.outputs.smoke != 'true' && (needs.sign.result == 'success' || needs.detect.outputs.retry == 'true')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.detect.outputs.baseline }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-candidates
          path: automation-out
          run-id: ${{ needs.detect.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-apk
          path: automation-out
          run-id: ${{ needs.detect.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Commit and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/autoupdate/publish.py publish --plan automation-out/plan.json --artifacts automation-out --expected '${{ needs.detect.outputs.baseline }}'
  failure:
    needs: [detect, selftest, fetch, build, sign, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: sync-plan
          path: automation-out
      - name: Open failure PR with logs link, never candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/autoupdate/publish.py failure --plan automation-out/plan.json --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
